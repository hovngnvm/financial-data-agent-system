# .github/workflows/ci.yml
name: FinAgent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install --extra-index-url https://vnstocks.com/api/simple -r requirements.txt; fi

      - name: Static compilation check
        run: |
          python -m py_compile main.py conftest.py $(find src tests -name "*.py")

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ main.py conftest.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 src/ tests/ main.py conftest.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=. pytest tests/ -v --ignore=tests/evaluate.py --ignore=tests/seed_data.py

      - name: Run 3-Layer RAG Evaluation Suite
        run: |
          PYTHONPATH=. python tests/evaluate.py

