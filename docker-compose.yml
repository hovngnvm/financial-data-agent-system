services:
  kafka:
    image: apache/kafka:3.7.0  # Official Apache image
    container_name: kafka
    ports:
      - "9092:9092" # External host port mapping
    environment:
      # Cluster & KRaft Node configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      
      # Listener definitions
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      
      # Listener mapping: separate internal Docker network and external host network
      # - Internal Docker: kafka:29092
      # - External Host: localhost:9092
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      
      # Apache optimizations
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 # Correct replication parameter name
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true' # Auto-create topics on ingestion
      
      # Cluster Identifier for KRaft
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse
    restart: always
    environment:
      - CLICKHOUSE_USER=${DB_USER:-finuser}
      - CLICKHOUSE_PASSWORD=${DB_PASSWORD:-finpassword}
      - CLICKHOUSE_DB=${DB_NAME:-finance_db}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  langfuse_db:
    image: postgres:16-alpine
    container_name: langfuse_db
    restart: always
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-secret_password}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
    ports:
      - "5433:5432"
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  langfuse_server:
    image: langfuse/langfuse:2
    container_name: langfuse_server
    restart: always
    depends_on:
      - langfuse_db
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-secret_password}@langfuse_db:5432/${LANGFUSE_DB_NAME:-langfuse}
      - NEXTAUTH_URL=${LANGFUSE_HOST:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-secret_salt_string_for_auth_encryption}
      - SALT=${SALT:-secret_salt_for_password_hashing}
      - TELEMETRY_ENABLED=false

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_cache_data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  clickhouse_data:
  langfuse_db_data:
  redis_cache_data:
  qdrant_data: